name: Update Security News Data

on:
  schedule:
    - cron: '0 * * * *' # 1時間ごとに自動実行
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pydantic feedparser

      - name: Run Fetch & Summarize Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python fetch_and_summarize_script.py

      - name: Commit and Push Updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add security_news_data.json
          git diff --staged --quiet || (git commit -m "Auto-update security news data [skip ci]" && git push)

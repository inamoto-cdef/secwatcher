name: Update Security News Data

on:
  schedule:
    # 毎時0分に自動実行 (UTC時間)
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fetch & Summarize Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_and_summarize.py

      - name: Commit and Push Updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add security_news_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update security news data [skip ci]" && git push)
